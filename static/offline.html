<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06382A"><meta name="color-scheme" content="light"><title>ChamaPay · Offline</title><style>:root{color-scheme:light;background:#f4f7f5;color:#10251f}*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#10251f;font-family:Arial,system-ui,sans-serif;-webkit-text-size-adjust:100%}.top{background:#06382A;color:#fff;padding:15px 18px;box-shadow:0 8px 25px rgba(6,56,42,.12)}.brand{font-size:21px;font-weight:800}.wrap{max-width:920px;margin:auto;padding:18px 14px 34px}.notice{background:#fff;border:1px solid #dce7e2;border-radius:19px;padding:17px;margin-bottom:14px;box-shadow:0 8px 28px rgba(6,56,42,.07)}.status{display:inline-flex;align-items:center;gap:7px;background:#fff5dc;color:#78590d;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;margin-bottom:10px}.dot{width:7px;height:7px;border-radius:50%;background:#c68b00}.notice h1{font-size:22px;margin:0 0 6px}.muted{color:#65756f;font-size:13px;line-height:1.5;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dce7e2;border-radius:18px;padding:16px;box-shadow:0 8px 28px rgba(6,56,42,.06)}.card h2{margin:0 0 5px;font-size:17px}.card p{margin:0;color:#65756f;font-size:12px;line-height:1.45}.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{background:#f4f7f5;border-radius:14px;padding:12px}.metric small{display:block;color:#65756f;font-size:10px}.metric b{display:block;margin-top:4px;font-size:17px}.sync{margin-top:11px;padding-top:11px;border-top:1px solid #e1e9e5;font-size:11px;color:#65756f}.empty{padding:22px;text-align:center;color:#65756f}.footer{margin-top:16px;text-align:center;color:#7a8984;font-size:11px}@media(max-width:560px){.wrap{padding:14px 11px 28px}.grid{grid-template-columns:1fr}.notice h1{font-size:20px}.metric-grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><header class="top"><div class="brand">ChamaPay</div></header><main class="wrap"><section class="notice"><div class="status"><i class="dot"></i> Offline mode</div><h1>Your Chama is still here</h1><p class="muted">You're offline. ChamaPay is showing the latest safe information saved on this device. Secure changes will resume when you reconnect.</p><div id="sync" class="sync"></div></section><div id="saved" class="grid"></div><p class="footer">Reconnect to refresh your latest Chama information.</p></main><script>(function(){var el=document.getElementById('saved'),sync=document.getElementById('sync');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function money(v){if(v==null||v==='')return '—';return esc(v)}try{var data=JSON.parse(localStorage.getItem('chamapay-offline-summary')||'null');if(data&&data.savedAt){sync.textContent='Last synchronized '+new Date(data.savedAt).toLocaleString()}if(data&&data.items&&data.items.length){el.innerHTML=data.items.map(function(x){return '<article class="card"><h2>'+esc(x.name||'My Chama')+'</h2><div class="metric-grid">'+(x.metrics||[]).map(function(m){return '<div class="metric"><small>'+esc(m.label)+'</small><b>'+money(m.value)+'</b></div>'}).join('')+'</div><p style="margin-top:10px">'+esc(x.meta||'Saved Chama information')+'</p></article>'}).join('')}else{el.innerHTML='<article class="card empty"><b>No offline snapshot yet.</b><br><br>Open your Chama dashboard once while online. ChamaPay will save a small, non-sensitive snapshot for your next offline session.</article>'}}catch(e){el.innerHTML='<article class="card empty">Your saved Chama information could not be loaded.</article>'}})();</script></body></html>

{% extends "base.html" %}{% block title %}Log in - ChamaPay{% endblock %}
{% block content %}<div class="auth card"><h1>Welcome back</h1><p class="mute">Log in with your email or phone number.</p>
<form method="POST">{{ csrf_input() }}
<div class="field"><label for="l">Email or phone</label><input id="l" name="login" autocomplete="username" required autofocus></div>
<div class="field"><label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
<button class="btn pri block">Log in</button></form>
<p class="mute" style="text-align:center;margin:0 0 6px"><a href="{{ url_for('forgot') }}">Forgot your password?</a></p>
<p class="mute" style="text-align:center;margin-bottom:0">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}

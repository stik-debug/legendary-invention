{% extends "base.html" %}{% block title %}Contribution schedules - {{ chama.name }}{% endblock %}
{% block content %}
<div class="head">
  <h1>Contribution schedules</h1>
  <a href="{{ url_for('chama_ledger', chama_id=chama.id) }}" class="btn sm">Back</a>
</div>
<div style="max-width:600px">
  <form method="POST" action="{{ url_for('contribution_schedule', chama_id=chama.id) }}">
    {{ csrf_input() }}
    {% if schedule %}
    <input type="hidden" name="schedule_id" value="{{ schedule.id }}">
    <h2>Edit schedule</h2>
    {% else %}
    <h2>New contribution schedule</h2>
    {% endif %}
    <div class="field">
      <label for="amount">Amount (KES)</label>
      <input type="number" id="amount" name="amount" value="{{ schedule.amount_cents/100 if schedule else '' }}" step="0.01" required>
    </div>
    <div class="field">
      <label for="frequency">Frequency</label>
      <select id="frequency" name="frequency" required>
        <option value="WEEKLY" {% if schedule and schedule.frequency=='WEEKLY' %}selected{% endif %}>Weekly</option>
        <option value="BI_WEEKLY" {% if schedule and schedule.frequency=='BI_WEEKLY' %}selected{% endif %}>Bi-weekly</option>
        <option value="MONTHLY" {% if schedule and schedule.frequency=='MONTHLY' %}selected{% endif %}>Monthly</option>
      </select>
    </div>
    <div class="field">
      <label for="start_date">Start date</label>
      <input type="date" id="start_date" name="start_date" value="{{ schedule.start_date if schedule else '' }}" required>
    </div>
    <div class="field">
      <label for="end_date">End date (optional)</label>
      <input type="date" id="end_date" name="end_date" value="{{ schedule.end_date if schedule else '' }}">
    </div>
    <div class="field">
      <label for="is_active">Active</label>
      <select id="is_active" name="is_active">
        <option value="1" {% if not schedule or schedule.is_active %}selected{% endif %}>Yes</option>
        <option value="0" {% if schedule and not schedule.is_active %}selected{% endif %}>No</option>
      </select>
    </div>
    <button type="submit" class="btn pri block">Save schedule</button>
  </form>
</div>
{% endblock %}

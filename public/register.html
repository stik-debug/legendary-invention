<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — ChamaPay</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="logo">Chama<span>Pay</span></a>
      <h1>Create your account</h1>
      <p class="sub">Start managing your Chama in minutes. 7-day trial included.</p>
      <div class="form-error" id="err"></div>
      <form id="form">
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" required minlength="2" autocomplete="name" placeholder="Jane Wanjiku" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="phone">Phone (Kenya)</label>
          <input id="phone" name="phone" required autocomplete="tel" placeholder="2547XXXXXXXX" />
        </div>
        <div class="form-group">
          <label for="password">Password (min 8 characters)</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="btn">Create account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const err = document.getElementById('err');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Creating…';
      try {
        const body = {
          fullName: document.getElementById('fullName').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          password: document.getElementById('password').value,
        };
        const { data } = await API.register(body);
        API.token = data.token;
        const me = await API.me();
        API.user = me.data;
        location.href = '/app/create-chama.html';
      } catch (ex) {
        err.textContent = ex.message || 'Registration failed';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>

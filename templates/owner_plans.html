{% extends "base.html" %}{% block title %}Plans - Control Center - ChamaPay Kenya{% endblock %}
{% block content %}
<div class="head">
  <h1>Subscription plans</h1>
  {% include '_owner_nav.html' %}
</div>
<section style="margin-bottom:28px">
  <h2>Settings</h2>
  <form method="POST" action="{{ url_for('owner_plans') }}" style="max-width:600px">
    {{ csrf_input() }}
    <input type="hidden" name="kind" value="settings">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
      <div class="field" style="margin:0">
        <label for="trial_days">Trial days</label>
        <input type="number" id="trial_days" name="trial_days" value="{{ cfg.trial_days }}" min="0" max="90" required>
      </div>
      <div class="field" style="margin:0">
        <label for="grace_days">Grace period days</label>
        <input type="number" id="grace_days" name="grace_days" value="{{ cfg.grace_days }}" min="0" max="30" required>
      </div>
      <div class="field" style="margin:0">
        <label for="billing_period_days">Billing period (days)</label>
        <input type="number" id="billing_period_days" name="billing_period_days" value="{{ cfg.billing_period_days }}" min="1" max="366" required>
      </div>
    </div>
    <button type="submit" class="btn pri block" style="margin-top:12px;max-width:140px">Save settings</button>
  </form>
</section>
<h2>Plans</h2>
{% for p in plans %}
<form method="POST" action="{{ url_for('owner_plans') }}" style="max-width:600px;margin-bottom:20px">
  {{ csrf_input() }}
  <input type="hidden" name="plan_id" value="{{ p.id }}">
  <div class="card">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px">
      <div class="field" style="margin:0">
        <label for="name">Name</label>
        <input type="text" name="name" value="{{ p.name }}" required>
      </div>
      <div class="field" style="margin:0">
        <label for="price">Price (KES)</label>
        <input type="number" name="price" value="{{ p.price_cents / 100 }}" step="0.01" required>
      </div>
      <div class="field" style="margin:0">
        <label for="max_members">Max members</label>
        <input type="number" name="max_members" value="{{ p.max_members }}" min="1" required>
      </div>
      <div class="field" style="margin:0">
        <label for="is_active">Active</label>
        <select name="is_active">
          <option value="1" {% if p.is_active %}selected{% endif %}>Yes</option>
          <option value="0" {% if not p.is_active %}selected{% endif %}>No</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn block" style="margin-top:12px">Save plan</button>
  </div>
</form>
{% endfor %}
{% endblock %}

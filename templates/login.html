{% extends "base.html" %}{% block title %}Log in - ChamaPay Kenya{% endblock %}
{% block content %}
<div class="auth">
  <h1>Log in</h1>
  <p class="mute">Enter your email or phone number and password.</p>
  <form method="POST" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
    <div class="field">
      <label for="login">Email or phone</label>
      <input type="text" id="login" name="login" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn pri block" style="margin-top:6px">Log in</button>
  </form>
  <p style="margin-top:20px;text-align:center;color:var(--mute)">No account yet? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}

{% extends "base.html" %}{% block title %}Start a new chama - ChamaPay Kenya{% endblock %}
{% block content %}
<div style="max-width:600px">
  <h1>Start a new chama</h1>
  <p class="mute" style="margin-bottom:28px">You'll be the admin. Invite members once you're set up. You get a {{ trial }}-day free trial.</p>
  <form method="POST" action="{{ url_for('chama_new') }}">
    {{ csrf_input() }}
    <div class="field">
      <label for="name">Chama name</label>
      <input type="text" id="name" name="name" placeholder="e.g., Kasarani Chama" required>
    </div>
    <div class="field">
      <label for="description">Description (optional)</label>
      <textarea id="description" name="description" placeholder="What does your chama do?" rows="3"></textarea>
    </div>
    <div class="field">
      <label>Choose a plan</label>
      {% for p in plans %}
      <label class="radio">
        <input type="radio" name="plan" value="{{ p.code }}" {% if p.code=='growth' %}checked{% endif %}>
        <div class="grow">
          <b>{{ p.name }}: KES {{ p.price_cents|kes }}/month</b>
          <small>Up to {{ p.max_members }} members</small>
        </div>
      </label>
      {% endfor %}
    </div>
    <button type="submit" class="btn pri block">Create chama</button>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}{% block title %}Register - ChamaPay Kenya{% endblock %}
{% block content %}
<div class="auth">
  <h1>Create your account</h1>
  <p class="mute">Join a chama or start a new one.</p>
  <form method="POST" action="{{ url_for('register') }}">
    {{ csrf_input() }}
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="phone">Kenyan phone number</label>
      <input type="tel" id="phone" name="phone" placeholder="0712345678 or +254712345678" required>
    </div>
    <div class="field">
      <label for="join_code">Join code <span class="mute">(if added to a chama)</span></label>
      <input type="text" id="join_code" name="join_code" placeholder="Optional: 8 digits">
    </div>
    <div class="field">
      <label for="password">Password (8+ characters)</label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" required>
    </div>
    <button type="submit" class="btn pri block" style="margin-top:6px">Create account</button>
  </form>
  <p style="margin-top:20px;text-align:center;color:var(--mute)">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
